services:
  influxdb3:
    image: influxdb:3-core
    container_name: dinis-influxdb3
    user: "0:0"
    environment:
      - INFLUXDB3_TOKEN=${INFLUXDB3_TOKEN:-}
      - INFLUXDB3_NODE_ID=${INFLUXDB3_NODE_ID:-dinis-node}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -n "$$INFLUXDB3_TOKEN" ]; then
          mkdir -p /var/lib/influxdb3
          echo "{\"token\": \"$$INFLUXDB3_TOKEN\", \"name\": \"admin\"}" > /var/lib/influxdb3/admin-token.json
          chmod 0600 /var/lib/influxdb3/admin-token.json
          exec influxdb3 serve \
            --node-id=$${INFLUXDB3_NODE_ID:-dinis-node} \
            --object-store=file \
            --data-dir=/var/lib/influxdb3/data \
            --admin-token-file=/var/lib/influxdb3/admin-token.json \
            --disable-authz health,ping
        else
          exec influxdb3 serve \
            --node-id=$${INFLUXDB3_NODE_ID:-dinis-node} \
            --object-store=file \
            --data-dir=/var/lib/influxdb3/data \
            --without-auth
        fi
    expose:
      - 8181
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8181/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  dinis:
    build: .
    container_name: dinis
    cap_add:
      - NET_RAW
    # Optional on Linux: use host networking for direct layer-2 ICMP monitoring
    # and to preserve real client source IPs for DINIS_ALLOWED_CLIENT_IPS:
    # network_mode: host
    environment:
      - DINIS_DATA=${DINIS_DATA:-/data/dinis.json}
      - DINIS_PORT=${DINIS_PORT:-8080}
      - DINIS_API_TOKEN=${DINIS_API_TOKEN:-}
      - DINIS_ALLOWED_HOSTS=${DINIS_ALLOWED_HOSTS:-}
      - DINIS_ALLOWED_CLIENT_IPS=${DINIS_ALLOWED_CLIENT_IPS:-}
      - DINIS_TRUSTED_PROXIES=${DINIS_TRUSTED_PROXIES:-docker}
      - DINIS_ALLOWED_ORIGINS=${DINIS_ALLOWED_ORIGINS:-}
      - DINIS_MAX_METRIC_HOSTS=${DINIS_MAX_METRIC_HOSTS:-10000}
      - INFLUXDB3_URL=${INFLUXDB3_URL:-http://influxdb3:8181}
      - INFLUXDB3_BUCKET=${INFLUXDB3_BUCKET:-dinis}
      - INFLUXDB3_TOKEN=${INFLUXDB3_TOKEN:-}
    expose:
      - 8080
    volumes:
      - dinis-data:/data
    depends_on:
      influxdb3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: dinis-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_INFLUX_PORT:-8181}:8181"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      dinis:
        condition: service_healthy
      influxdb3:
        condition: service_healthy
    restart: unless-stopped

volumes:
  influxdb3-data:
  dinis-data:
