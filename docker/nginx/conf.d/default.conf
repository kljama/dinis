# 1. DINIS Web Dashboard & REST API Entrypoint
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 5M;

    # Common reverse proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Real-Time Server-Sent Events (SSE) Streaming
    location = /api/stream {
        proxy_pass http://dinis:8080/api/stream;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # Static assets caching
    location ~* \.(css|js|svg|png|ico|woff2)$ {
        proxy_pass http://dinis:8080;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Standard REST API and Web Dashboard
    location / {
        proxy_pass http://dinis:8080;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# 2. InfluxDB 3 Core Entrypoint (Accessible for External Grafana)
server {
    listen 8181;
    listen [::]:8181;
    server_name _;

    # Allow large batches for InfluxDB line-protocol writes and query responses
    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        proxy_pass http://influxdb3:8181;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
