# Docker's embedded DNS. Upstreams are set in variables, so nginx resolves container names per
# request (cached 10s): nginx starts even if a container is down, and it follows a container to
# its new IP after the container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# The certificate and the TLS settings are in nginx.conf.

# 0. Plain HTTP: send all requests to HTTPS.
# The redirect goes to port 443. If you set NGINX_HTTPS_PORT to a different port, open
# https://<server>:<port> directly.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. DINIS Web Dashboard & REST API Entrypoint
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # HTTP/2 lets the browser use many streams on one connection. With HTTP/1.1 each open SSE
    # stream (one for each dashboard tab) holds one of the 6 connections that a browser opens
    # to one host.
    http2 on;
    server_name _;

    client_max_body_size 5M;

    set $dinis_upstream http://dinis:8080;

    # Common reverse proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Real-Time Server-Sent Events (SSE) Streaming
    location = /api/stream {
        proxy_pass $dinis_upstream;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # Static assets caching
    location ~* \.(css|js|svg|png|ico|woff2)$ {
        proxy_pass $dinis_upstream;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Standard REST API and Web Dashboard
    location / {
        proxy_pass $dinis_upstream;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# 2. InfluxDB 3 Explorer Web UI Entrypoint (HTTPS on its own port)
# Explorer is built for "/" (its page has <base href="/"> and calls /api/...). It cannot run
# under a sub-path, so it keeps its own port.
server {
    listen 8888 ssl;
    listen [::]:8888 ssl;
    http2 on;
    server_name _;

    # A plain HTTP request to this TLS port gets error 497. Send it to HTTPS on the same port.
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 50M;

    set $explorer_upstream http://influxdb-explorer:8080;

    location / {
        proxy_pass $explorer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
